; Overrides layered on top of the base image's php.ini-production.
memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 120
date.timezone = UTC

; Opcache: keep validation on so bind-mounted code changes are picked up
; without restarting the container during development.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
